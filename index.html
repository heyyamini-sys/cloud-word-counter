<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Word Counter</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem 1rem; }
        .card { background: white; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; max-width: 560px; overflow: hidden; }
        .card-header { background: #1a1f2e; padding: 2rem; text-align: center; }
        .logo-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 6px; }
        .logo-icon { width: 36px; height: 36px; background: #ff9900; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
        .logo-icon i { font-size: 20px; color: #1a1f2e; }
        .header-title { font-size: 20px; font-weight: 600; color: #fff; }
        .header-sub { font-size: 13px; color: rgba(255,255,255,0.5); }
        .card-body { padding: 1.75rem 2rem; }
        .input-label { font-size: 13px; color: #666; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        textarea { width: 100%; height: 160px; border: 1px solid #e0e0e0; border-radius: 10px; padding: 14px; font-size: 15px; font-family: inherit; resize: none; transition: border-color 0.2s; line-height: 1.6; }
        textarea:focus { outline: none; border-color: #ff9900; }
        .char-counter { text-align: right; font-size: 12px; color: #aaa; margin-top: 4px; }
        .btn-analyze { width: 100%; margin-top: 1rem; padding: 14px; background: #ff9900; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.2s; }
        .btn-analyze:hover { background: #e68a00; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 1.25rem; }
        .stat-card { background: #f8f9fa; border-radius: 10px; padding: 1rem 1.25rem; border: 1px solid #eee; }
        .stat-label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 0.05em; display: flex; align-items: center; gap: 5px; margin-bottom: 6px; }
        .stat-value { font-size: 28px; font-weight: 600; color: #1a1f2e; }
        .stat-value.pending { color: #ccc; font-size: 20px; }
        .status-bar { margin-top: 1rem; padding: 10px 14px; border-radius: 10px; font-size: 13px; display: flex; align-items: center; gap: 8px; background: #f8f9fa; color: #888; }
        .status-bar.loading { background: #fff3cd; color: #856404; }
        .status-bar.success { background: #d1e7dd; color: #0f5132; }
        .status-bar.error { background: #f8d7da; color: #842029; }
        .divider { border: none; border-top: 1px solid #f0f0f0; margin: 1.25rem 0; }
        .footer-row { display: flex; align-items: center; justify-content: space-between; }
        .badge { font-size: 11px; padding: 4px 10px; border-radius: 20px; background: #fff3cd; color: #856404; border: 1px solid #ffc107; display: flex; align-items: center; gap: 4px; }
        .badge.gray { background: #f8f9fa; color: #666; border-color: #e0e0e0; }
    </style>
</head>
<body>
<div class="card">
    <div class="card-header">
        <div class="logo-row">
            <div class="logo-icon"><i class="ti ti-writing"></i></div>
            <span class="header-title">Word Count Analytics</span>
        </div>
        <p class="header-sub">Powered by AWS Lambda &amp; API Gateway</p>
    </div>
    <div class="card-body">
        <p class="input-label"><i class="ti ti-align-left"></i> Enter your text</p>
        <textarea id="textInput" placeholder="Type or paste your text here..." oninput="updateCounter()"></textarea>
        <div class="char-counter"><span id="liveChar">0 characters typed</span></div>

        <button class="btn-analyze" onclick="analyzeText()">
            <i class="ti ti-cloud-upload"></i> Analyze &amp; Save to Cloud
        </button>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label"><i class="ti ti-text-size"></i> Words</div>
                <div class="stat-value pending" id="wordCount">—</div>
            </div>
            <div class="stat-card">
                <div class="stat-label"><i class="ti ti-letter-case"></i> Characters</div>
                <div class="stat-value pending" id="charCount">—</div>
            </div>
        </div>

        <div class="status-bar" id="statusBar">
            <i class="ti ti-info-circle"></i>
            <span id="statusText">Enter text and click Analyze to begin</span>
        </div>

        <hr class="divider">
        <div class="footer-row">
            <div class="badge"><i class="ti ti-cloud"></i> AWS Lambda</div>
            <div class="badge"><i class="ti ti-api"></i> API Gateway</div>
            <div class="badge gray"><i class="ti ti-map-pin"></i> us-west-2</div>
        </div>
    </div>
</div>

<script>
function updateCounter() {
    document.getElementById('liveChar').textContent = document.getElementById('textInput').value.length + ' characters typed';
}

async function analyzeText() {
    const text = document.getElementById('textInput').value;
    const statusBar = document.getElementById('statusBar');
    const wordEl = document.getElementById('wordCount');
    const charEl = document.getElementById('charCount');

    if (!text.trim()) { alert('Please enter some text!'); return; }

    statusBar.className = 'status-bar loading';
    statusBar.innerHTML = '<i class="ti ti-loader"></i><span>Sending to AWS Lambda...</span>';
    wordEl.className = 'stat-value pending'; wordEl.textContent = '...';
    charEl.className = 'stat-value pending'; charEl.textContent = '...';

    try {
        const response = await fetch('https://czwyrrapq0.execute-api.us-west-2.amazonaws.com/prod/count', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: text })
        });
        const data = await response.json();
        wordEl.className = 'stat-value'; wordEl.textContent = data.words;
        charEl.className = 'stat-value'; charEl.textContent = data.characters;
        statusBar.className = 'status-bar success';
        statusBar.innerHTML = '<i class="ti ti-circle-check"></i><span>Analysis complete — saved to cloud!</span>';
    } catch (err) {
        wordEl.textContent = '—'; charEl.textContent = '—';
        statusBar.className = 'status-bar error';
        statusBar.innerHTML = '<i class="ti ti-alert-circle"></i><span>Failed to connect. Check CORS or Lambda settings.</span>';
    }
}
</script>
</body>
</html>
